<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Void Runner</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;900&display=swap');

        body {
            margin: 0;
            overflow: hidden;
            background-color: #050505;
            font-family: 'Orbitron', sans-serif;
            touch-action: none;
        }

        canvas { display: block; }

        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            box-sizing: border-box;
        }

        .score-board {
            color: #0ff;
            text-shadow: 0 0 10px #0ff;
            font-size: 24px;
            font-weight: 900;
        }

        #menu {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            pointer-events: auto;
            background: rgba(0, 0, 0, 0.85);
            padding: 40px;
            border-radius: 20px;
            border: 2px solid #0ff;
            box-shadow: 0 0 20px #0ff;
            backdrop-filter: blur(5px);
        }

        button {
            background: transparent;
            color: #0ff;
            border: 2px solid #0ff;
            padding: 15px 40px;
            font-size: 18px;
            font-family: 'Orbitron', sans-serif;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            box-shadow: 0 0 10px #0ff;
        }
    </style>
</head>
<body>

    <canvas id="gameCanvas"></canvas>

    <div id="ui-layer">
        <div class="score-board">SCORE: <span id="scoreVal">0</span></div>
    </div>

    <div id="menu">
        <h1 style="color:#fff">NEON VOID</h1>
        <button id="startBtn">START GAME</button>
        <p style="color:#aaa; font-size:12px; margin-top:15px;">Drag to move</p>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        let width, height, player, enemies = [], frame = 0, score = 0, gameActive = false;

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
        }
        window.addEventListener('resize', resize);
        resize();

        class Player {
            constructor() {
                this.x = width / 2;
                this.y = height - 100;
                this.size = 20;
            }
            draw() {
                ctx.shadowBlur = 15;
                ctx.shadowColor = '#0ff';
                ctx.fillStyle = '#fff';
                ctx.beginPath();
                ctx.moveTo(this.x, this.y - this.size);
                ctx.lineTo(this.x - this.size, this.y + this.size);
                ctx.lineTo(this.x + this.size, this.y + this.size);
                ctx.closePath();
                ctx.fill();
            }
        }

        class Enemy {
            constructor() {
                this.x = Math.random() * width;
                this.y = -50;
                this.size = 20;
                this.speed = 5 + (score / 10);
            }
            draw() {
                ctx.shadowBlur = 10;
                ctx.shadowColor = '#f0f';
                ctx.strokeStyle = '#f0f';
                ctx.lineWidth = 3;
                ctx.strokeRect(this.x, this.y, this.size, this.size);
            }
        }

        function spawnEnemy() {
            if (frame % 30 === 0) enemies.push(new Enemy());
        }

        function update() {
            if (!gameActive) return;
            ctx.fillStyle = '#050505';
            ctx.fillRect(0, 0, width, height);

            player.draw();

            enemies.forEach((enemy, index) => {
                enemy.y += enemy.speed;
                enemy.draw();

                if (enemy.y > height) {
                    enemies.splice(index, 1);
                    score++;
                    document.getElementById('scoreVal').innerText = score;
                }

                // Коллизия
                if (Math.abs(player.x - enemy.x) < 30 && Math.abs(player.y - enemy.y) < 30) {
                    gameActive = false;
                    if(tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('error');
                    document.getElementById('menu').style.display = 'block';
                }
            });

            frame++;
            requestAnimationFrame(update);
        }

        window.addEventListener('touchmove', (e) => {
            player.x = e.touches[0].clientX;
        });

        document.getElementById('startBtn').onclick = () => {
            gameActive = true;
            score = 0;
            enemies = [];
            player = new Player();
            document.getElementById('menu').style.display = 'none';
            if(tg.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
            update();
        };
    </script>
</body>
</html>
